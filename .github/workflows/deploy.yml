name: Deploy to Oracle Cloud VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy vía SSH al VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Iniciando despliegue en VPS..."
            cd /home/ubuntu/smartsoft/arbitraje
            
            # Traer los últimos cambios
            git pull origin main
            
            # Actualizar dependencias si hubo cambios
            source venv/bin/activate
            pip install --no-cache-dir -r requirements.txt
            
            # Reiniciar el daemon de systemd
            sudo systemctl restart arbitraje.service
            
            echo "✅ Despliegue completado con éxito."
            sudo systemctl status arbitraje.service --no-pager

