<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Bot Arbitraje - Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card shadow-sm mb-3">
            <div class="card-body py-2 d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="mb-0 fs-4">⚡ Monitor</h3>
                    <small class="text-muted" style="font-size: 0.8em;">
                        Estado: <span id="status-dot" class="status-dot"></span> 
                        <span id="status-text">Desconocido</span>
                    </small>
                </div>
                
                <div class="d-flex gap-2">
                    <div class="dropdown">
                        <button class="btn btn-sm btn-outline-dark dropdown-toggle" type="button" id="dropdownFiltros" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                            <i class="bi bi-funnel-fill"></i> Filtrar Operaciones
                        </button>
                        <ul class="dropdown-menu p-3 shadow" aria-labelledby="dropdownFiltros" style="min-width: 250px;">
                            <li><h6 class="dropdown-header">Estrategia Compra</h6></li>
                            <li class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="check-compra-fuerte" checked onchange="aplicarFiltros()">
                                <label class="form-check-label fw-bold text-success" for="check-compra-fuerte">🚀 Compra Fuerte</label>
                            </li>
                            <li class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="check-compra" checked onchange="aplicarFiltros()">
                                <label class="form-check-label text-secondary" for="check-compra">🟢 Compra Normal</label>
                            </li>
                            
                            <li><hr class="dropdown-divider"></li>
                            <li><h6 class="dropdown-header">Estrategia Venta</h6></li>
                            
                            <li class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="check-venta-fuerte" checked onchange="aplicarFiltros()">
                                <label class="form-check-label fw-bold text-danger" for="check-venta-fuerte">🔥 Venta Fuerte</label>
                            </li>
                            <li class="form-check">
                                <input class="form-check-input" type="checkbox" id="check-venta" checked onchange="aplicarFiltros()">
                                <label class="form-check-label text-secondary" for="check-venta">🔴 Venta Normal</label>
                            </li>
                        </ul>
                        <button class="btn btn-sm btn-outline-secondary" onclick="limpiarDatos()" title="Borrar historial">
                        <i class="bi bi-trash-fill"></i>
                        </button>
                        <div class="dropdown">
                        </div>
                    </div>

                    <div class="btn-group btn-group-sm ms-2" role="group">
                        <button type="button" class="btn btn-outline-secondary" id="btn-sound" onclick="toggleSound()">
                            <i class="bi bi-volume-mute-fill" id="icon-sound"></i>
                        </button>
                        
                        <button type="button" class="btn btn-outline-success" id="btn-start" onclick="controlBot('startbot')">
                            <i class="bi bi-play-fill"></i> Iniciar
                        </button>
                        <button type="button" class="btn btn-outline-danger" id="btn-stop" onclick="controlBot('stopbot')">
                            <i class="bi bi-stop-fill"></i> Detener
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card shadow">
            <div class="card-body p-0"> 
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr style="font-size: 0.9em;">
                                <th>Hora</th>
                                <th>Ticker</th>
                                <th class="text-center">Operación</th>
                                <th class="text-end">Variación</th>
                                <th class="text-end">CI (In)</th> <th class="text-end">24h (Out)</th> </tr>
                        </thead>
                        <tbody id="tabla-cuerpo" style="font-size: 0.95em;">
                            </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer text-muted d-flex justify-content-between align-items-center py-1" style="font-size: 0.85em;">
                <div>
                    <strong>Visibles: <span id="alert-count">0</span></strong>
                </div>
                <div id="last-update">Sincronizando...</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
